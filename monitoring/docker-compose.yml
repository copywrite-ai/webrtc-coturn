name: tunnel-monitoring

services:
  monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    image: "${MONITOR_IMAGE:-webrtc-relay-demo:local}"
    command: ["node", "monitor.mjs"]
    restart: unless-stopped
    environment:
      MONITOR_PORT: "9010"
      MEDIAMTX_API_ORIGIN: "${MEDIAMTX_API_ORIGIN:-http://host.docker.internal:9997}"
      MEDIAMTX_METRICS_ORIGIN: "${MEDIAMTX_METRICS_ORIGIN:-http://host.docker.internal:9998}"
      MEDIAMTX_USERNAME: "${MEDIAMTX_USERNAME:-metrics}"
      MEDIAMTX_PASSWORD: "${MEDIAMTX_PASSWORD:-metrics123}"
      CLIENT_LOG_PATH: "/app/logs/client-events.log"
      DOCKER_SOCKET_PATH: "/var/run/docker.sock"
      PUBLISHER_CONTAINERS: "${PUBLISHER_CONTAINERS:-tunnel-fish_front_whip-1}"
      MONITOR_STREAMS: "${MONITOR_STREAMS:-fish_front}"
      MONITOR_POLL_MS: "${MONITOR_POLL_MS:-2000}"
      MONITOR_HISTORY_LIMIT: "${MONITOR_HISTORY_LIMIT:-900}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${CLIENT_LOG_HOST_PATH:-../logs}:/app/logs:ro"
      - "${DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    ports:
      - "${MONITOR_HOST_PORT:-9010}:9010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9010/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-2d}"
    depends_on:
      monitor:
        condition: service_healthy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  prometheus-data:
  grafana-data:
