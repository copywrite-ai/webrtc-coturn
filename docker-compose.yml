services:
  webrtc-relay-demo:
    build:
      context: .
    image: webrtc-relay-demo:local
    container_name: webrtc-relay-demo
    environment:
      PORT: "${PORT:-9001}"
      DEFAULT_ROOM: "${DEFAULT_ROOM:-demo-room}"
      DEFAULT_TURN_URLS: "${DEFAULT_TURN_URLS:-turn:turn-ip.example.com:3478?transport=udp,turn:turn-ip.example.com:3478?transport=tcp}"
      DEFAULT_TURN_USERNAME: "${DEFAULT_TURN_USERNAME:-}"
      DEFAULT_TURN_CREDENTIAL: "${DEFAULT_TURN_CREDENTIAL:-}"
      DEFAULT_SERVER_BANDWIDTH_MBPS: "${DEFAULT_SERVER_BANDWIDTH_MBPS:-20}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:-}"
      TURN_TTL_SECONDS: "${TURN_TTL_SECONDS:-86400}"
      TURN_EXPIRES_MODE: "${TURN_EXPIRES_MODE:-}"
      TURN_EXPIRES_AT: "${TURN_EXPIRES_AT:-}"
      TURN_USERNAME_SUFFIX: "${TURN_USERNAME_SUFFIX:-client}"
      TURN_PRESET_IP_LABEL: "${TURN_PRESET_IP_LABEL:-turn-ip.example.com}"
      TURN_PRESET_IP_URLS: "${TURN_PRESET_IP_URLS:-turn:turn-ip.example.com:3478?transport=udp,turn:turn-ip.example.com:3478?transport=tcp}"
      TURN_PRESET_IP_USERNAME: "${TURN_PRESET_IP_USERNAME:-}"
      TURN_PRESET_IP_CREDENTIAL: "${TURN_PRESET_IP_CREDENTIAL:-}"
      TURN_PRESET_DOMAIN_LABEL: "${TURN_PRESET_DOMAIN_LABEL:-turn.example.com}"
      TURN_PRESET_DOMAIN_URLS: "${TURN_PRESET_DOMAIN_URLS:-turn:turn.example.com:3480?transport=udp,turn:turn.example.com:3480?transport=tcp}"
      TURN_PRESET_DOMAIN_USERNAME: "${TURN_PRESET_DOMAIN_USERNAME:-}"
      TURN_PRESET_DOMAIN_CREDENTIAL: "${TURN_PRESET_DOMAIN_CREDENTIAL:-}"
      DEFAULT_WHIP_URL: "${DEFAULT_WHIP_URL:-/online/whip}"
      DEFAULT_WHEP_URL: "${DEFAULT_WHEP_URL:-/online/whep}"
      MEDIAMTX_ORIGIN: "${MEDIAMTX_ORIGIN:-http://mediamtx:8889}"
      MEDIAMTX_PATH_PREFIX: "${MEDIAMTX_PATH_PREFIX:-}"
      DEFAULT_FORCE_RELAY: "${DEFAULT_FORCE_RELAY:-1}"
      DEFAULT_TURN_ONLY: "${DEFAULT_TURN_ONLY:-1}"
      DEFAULT_AUTO_START: "${DEFAULT_AUTO_START:-1}"
      CLIENT_LOG_PATH: "/app/logs/client-events.log"
      VIEWER_CONTROL_TOKEN: "${VIEWER_CONTROL_TOKEN:-}"
    depends_on:
      - mediamtx
    volumes:
      - ./public:/app/public:ro
      - ./logs:/app/logs
    ports:
      - "${PORT:-9001}:${PORT:-9001}"

  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ${MEDIAMTX_CONFIG:-./mediamtx/mediamtx.yml}:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8889:8889"
      - "9997:9997"
      - "9998:9998"
      - "9999:9999"
      - "8000:8000/udp"
      - "8001:8001/udp"
      - "8189:8189/tcp"
      - "8189:8189/udp"

  monitor:
    build:
      context: .
    image: webrtc-relay-demo:local
    container_name: tunnel-monitor
    command: ["node", "monitor.mjs"]
    environment:
      MONITOR_PORT: "${MONITOR_PORT:-9010}"
      MEDIAMTX_API_ORIGIN: "${MEDIAMTX_API_ORIGIN:-http://mediamtx:9997}"
      MEDIAMTX_METRICS_ORIGIN: "${MEDIAMTX_METRICS_ORIGIN:-http://mediamtx:9998}"
      MEDIAMTX_USERNAME: "${MEDIAMTX_USERNAME:-metrics}"
      MEDIAMTX_PASSWORD: "${MEDIAMTX_PASSWORD:-metrics123}"
      CLIENT_LOG_PATH: "/app/logs/client-events.log"
      PUBLISHER_CONTAINERS: "${PUBLISHER_CONTAINERS:-tunnel-fish_front_whip-1,tunnel-fish_back_whip-1,tunnel-fish_left_whip-1,tunnel-fish_right_whip-1,tunnel-fish_front_remote_whip-1}"
      MONITOR_STREAMS: "${MONITOR_STREAMS:-fish_front,fish_back,fish_left,fish_right}"
    depends_on:
      - mediamtx
    volumes:
      - ./logs:/app/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${MONITOR_PORT:-9010}:${MONITOR_PORT:-9010}"

  derp-latency-exporter:
    profiles:
      - derp
    build:
      context: ./docker/derp-latency-exporter
    image: derp-latency-exporter:local
    container_name: derp-latency-exporter
    restart: unless-stopped
    environment:
      DERP_EXPORTER_PORT: "${DERP_EXPORTER_PORT:-9020}"
      DERP_NETCHECK_INTERVAL_MS: "${DERP_NETCHECK_INTERVAL_MS:-30000}"
      DERP_NETCHECK_TIMEOUT_MS: "${DERP_NETCHECK_TIMEOUT_MS:-20000}"
      DERP_REGION_ALLOWLIST: "${DERP_REGION_ALLOWLIST:-900}"
      TS_SOCKET: "${TS_SOCKET:-/tmp/tailscaled.sock}"
      TAILSCALE_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME:-derp-latency-exporter}"
      TAILSCALE_UP_EXTRA_ARGS: "${TAILSCALE_UP_EXTRA_ARGS:---reset}"
    volumes:
      - derp-tailscale-state:/var/lib/tailscale
    ports:
      - "${DERP_EXPORTER_PORT:-9020}:${DERP_EXPORTER_PORT:-9020}"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tunnel-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-2d}"
      - "--web.enable-lifecycle"
    depends_on:
      - mediamtx
      - monitor
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.5.0
    container_name: tunnel-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
  derp-tailscale-state:
