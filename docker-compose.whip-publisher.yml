services:
  whip_publisher_base:
    profiles:
      - build
    build:
      context: ./docker/whip-publisher
      dockerfile: Dockerfile.base
      args:
        UBUNTU_VERSION: "${WHIP_UBUNTU_VERSION:-24.04}"
        GST_PLUGINS_RS_REF: "${WHIP_GST_PLUGINS_RS_REF:-0.14.1}"
        BASE_IMAGE: "${WHIP_BASE_IMAGE:-docker.1ms.run/library/ubuntu:${WHIP_UBUNTU_VERSION:-24.04}}"
    image: "${WHIP_PUBLISHER_BASE_IMAGE:-tunnel-whip-publisher-base:ubuntu24.04-gst-rs-0.14.1}"

  fish_front_whip:
    build:
      context: .
      dockerfile: docker/whip-publisher/Dockerfile
      args:
        UBUNTU_VERSION: "${WHIP_UBUNTU_VERSION:-24.04}"
        GST_PLUGINS_RS_REF: "${WHIP_GST_PLUGINS_RS_REF:-0.14.1}"
        PUBLISHER_BASE_IMAGE: "${WHIP_PUBLISHER_BASE_IMAGE:-tunnel-whip-publisher-base:ubuntu24.04-gst-rs-0.14.1}"
    image: tunnel-whip-publisher:local
    cap_add:
      - NET_ADMIN
    environment:
      STREAM_NAME: fish_front
      DEVICE_ID: "${DEVICE_ID:?DEVICE_ID is required}"
      WHIP_BASE_URL: "${WHIP_BASE_URL:-http://mediamtx:8889}"
      WHIP_INCLUDE_DEVICE: "${WHIP_INCLUDE_DEVICE:-0}"
      WIDTH: "${WIDTH:-960}"
      HEIGHT: "${HEIGHT:-540}"
      FPS: "${FPS:-60}"
      BITRATE_KBPS: "${BITRATE_KBPS:-2500}"
      KEY_INT_MAX: "${KEY_INT_MAX:-120}"
      VIDEO_SOURCE: "${VIDEO_SOURCE:-testsrc}"
      VIDEO_DEVICE: "${VIDEO_DEVICE:-/dev/video0}"
      SOURCE_PIPELINE: "${SOURCE_PIPELINE:-}"
      PATTERN: "${PATTERN:-checkers-8}"
      TESTSRC_HORIZONTAL_SPEED: "${TESTSRC_HORIZONTAL_SPEED:-2}"
      SPEED_PRESET: "${SPEED_PRESET:-ultrafast}"
      TIMESTAMP_OVERLAY: "${TIMESTAMP_OVERLAY:-0}"
      TIMESTAMP_FONT: "${TIMESTAMP_FONT:-Sans 22}"
      TIMESTAMP_XPAD: "${TIMESTAMP_XPAD:-12}"
      TIMESTAMP_YPAD: "${TIMESTAMP_YPAD:-10}"
      TIMESTAMP_TZ: "${TIMESTAMP_TZ:-Asia/Shanghai}"
      GST_DEBUG_LEVEL: "${GST_DEBUG_LEVEL:-2}"
      GST_DEBUG: "${GST_DEBUG:-}"
      GST_DEBUG_NO_COLOR: "${GST_DEBUG_NO_COLOR:-0}"
      WHIP_STUN_SERVER: "${WHIP_STUN_SERVER:-}"
      WHIP_TURN_SERVER: "${WHIP_TURN_SERVER:-}"
      WHIP_TURN_SERVER_2: "${WHIP_TURN_SERVER_2:-}"
      WHIP_FORCE_TURN: "${WHIP_FORCE_TURN:-0}"
      WHIP_SINK_EXTRA_ARGS: "${WHIP_SINK_EXTRA_ARGS:-}"
      ORTM_X: "${ORTM_X:-24}"
      ORTM_Y: "${ORTM_Y:-24}"
      ORTM_CELL: "${ORTM_CELL:-12}"
      ORTM_PADDING: "${ORTM_PADDING:-12}"
      ORTM_BACKGROUND_ALPHA: "${ORTM_BACKGROUND_ALPHA:-0.15}"
      ORTM_CELL_ALPHA: "${ORTM_CELL_ALPHA:-0.65}"
      ORTM_BORDER_ALPHA: "${ORTM_BORDER_ALPHA:-1.0}"
      ORTM_FINDER_LAYOUT: "${ORTM_FINDER_LAYOUT:-four}"
      X264_OPTION_STRING: "${X264_OPTION_STRING:-nal-hrd=cbr:force-cfr=1:filler=1}"
      X264_THREADS: "${X264_THREADS:-}"
      X264_SLICED_THREADS: "${X264_SLICED_THREADS:-}"
      X264_VBV_BUF_CAPACITY_MS: "${X264_VBV_BUF_CAPACITY_MS:-}"
      WHIP_CC_MIN_BITRATE_BPS: "${WHIP_CC_MIN_BITRATE_BPS:-}"
      WHIP_CC_MAX_BITRATE_BPS: "${WHIP_CC_MAX_BITRATE_BPS:-}"
      WHIP_MITIGATION_MODES: "${WHIP_MITIGATION_MODES:-none}"
      PTS_OFFSET_CONFIRM_SAMPLES: "${PTS_OFFSET_CONFIRM_SAMPLES:-5}"
      PIPELINE_RATE_WATCHDOG: "${PIPELINE_RATE_WATCHDOG:-1}"
      PIPELINE_RATE_WATCHDOG_WARMUP_SECONDS: "${PIPELINE_RATE_WATCHDOG_WARMUP_SECONDS:-5}"
      PIPELINE_RATE_WATCHDOG_MAX_FPS_RATIO: "${PIPELINE_RATE_WATCHDOG_MAX_FPS_RATIO:-1.5}"
      PIPELINE_RATE_WATCHDOG_MAX_BITRATE_RATIO: "${PIPELINE_RATE_WATCHDOG_MAX_BITRATE_RATIO:-2.0}"
      PIPELINE_RATE_WATCHDOG_CONSECUTIVE: "${PIPELINE_RATE_WATCHDOG_CONSECUTIVE:-3}"
    restart: unless-stopped

