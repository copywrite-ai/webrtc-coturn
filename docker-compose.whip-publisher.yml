      ORTM_CELL: "${ORTM_CELL:-12}"
      ORTM_PADDING: "${ORTM_PADDING:-12}"
      ORTM_BACKGROUND_ALPHA: "${ORTM_BACKGROUND_ALPHA:-0.15}"
      ORTM_CELL_ALPHA: "${ORTM_CELL_ALPHA:-0.65}"
