logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: metrics
    pass: metrics123
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

api: true
apiAddress: :9997

metrics: true
metricsAddress: :9998

pprof: true
pprofAddress: :9999

hls: false
rtsp: true
rtmp: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: false
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts:
  - 127.0.0.1
  - peng-mbp14.li-adder.ts.net

# MediaMTX also needs TURN on the server side; browser-only ICE config is not enough for WHEP.
# These values should match the TURN service actually used by the demo web app.
webrtcICEServers2:
  - url: turn:47.102.106.162:3478?transport=udp
    username: AUTH_SECRET
    password: be331ba315bf4b5484fc92a9514be0d7fca40df62d8bb1295946c4a6682781c0
    clientOnly: false
  - url: turn:47.102.106.162:3478?transport=tcp
    username: AUTH_SECRET
    password: be331ba315bf4b5484fc92a9514be0d7fca40df62d8bb1295946c4a6682781c0
    clientOnly: false

pathDefaults:
