<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIP Publisher</title>
    <script src="/config.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --line: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Pro Display", "PingFang SC", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      }
      .wrap {
        width: min(980px, calc(100% - 24px));
        margin: 24px auto 40px;
        display: grid;
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      input, textarea, button, select {
        font: inherit;
      }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        background: #dbeafe;
      }
      button.primary {
        background: var(--accent);
        color: white;
      }
      video {
        width: 100%;
        min-height: 360px;
        border-radius: 16px;
        background: #0f172a;
      }
      .log {
        min-height: 180px;
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        padding: 12px;
        border-radius: 14px;
        background: #111827;
        color: #e5e7eb;
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="panel">
        <h1>WHIP Publisher</h1>
        <p class="hint">
          这是一个最小 WHIP 推流页。它会采集本地摄像头并把流直接推给标准 WHIP endpoint。
        </p>
      </section>

      <section class="panel">
        <div class="grid">
          <label>
            WHIP 地址
            <input id="whipUrl" value="/online/whip" />
          </label>
          <label>
            Bearer Token（可选）
            <input id="bearerToken" placeholder="optional bearer token" />
          </label>
        </div>
        <div class="grid" style="margin-top: 12px;">
          <label>
            ICE / TURN 地址（每行一个，可选）
            <textarea id="iceUrls" placeholder="turn:turn.example.com:3478?transport=udp&#10;turn:turn.example.com:3478?transport=tcp"></textarea>
          </label>
          <div class="grid" style="grid-template-columns: 1fr;">
            <label>
              Username（可选）
              <input id="turnUsername" placeholder="temporary username" />
            </label>
            <label>
              Credential（可选）
              <input id="turnCredential" placeholder="temporary credential" />
            </label>
          </div>
        </div>
        <div class="grid" style="margin-top: 12px;">
          <label>
            视频来源
            <select id="sourceMode">
              <option value="camera">camera</option>
              <option value="screen">screen</option>
            </select>
          </label>
        </div>
        <div class="actions" style="margin-top: 12px;">
          <button class="primary" id="startBtn">开始推流</button>
          <button id="stopBtn">停止</button>
        </div>
      </section>

      <section class="panel">
        <video id="preview" autoplay playsinline muted></video>
      </section>

      <section class="panel">
        <h2>日志</h2>
        <div id="log" class="log"></div>
      </section>
    </div>

    <script>
      const whipUrlInput = document.getElementById('whipUrl');
      const bearerTokenInput = document.getElementById('bearerToken');
      const iceUrlsInput = document.getElementById('iceUrls');
      const turnUsernameInput = document.getElementById('turnUsername');
      const turnCredentialInput = document.getElementById('turnCredential');
      const sourceModeSelect = document.getElementById('sourceMode');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const preview = document.getElementById('preview');
      const logEl = document.getElementById('log');
      const appConfig = window.APP_CONFIG || {};

      let pc = null;
      let localStream = null;
      let sessionUrl = null;

      function log(message) {
        const line = `${new Date().toISOString()} ${message}`;
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(line);
      }

      function buildIceServers() {
        const urls = iceUrlsInput.value
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean);

        if (!urls.length) {
          return [];
        }

        return [{
          urls,
          username: turnUsernameInput.value.trim(),
          credential: turnCredentialInput.value.trim(),
        }];
      }

      function waitForIceGatheringComplete(connection) {
        if (connection.iceGatheringState === 'complete') {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          const handler = () => {
            if (connection.iceGatheringState === 'complete') {
              connection.removeEventListener('icegatheringstatechange', handler);
              resolve();
            }
          };
          connection.addEventListener('icegatheringstatechange', handler);
        });
      }

      function resolveRequestUrl(value) {
        return new URL(String(value || '').trim(), location.href).toString();
      }

      function resolveSessionUrl(locationHeader, requestUrl) {
        if (!locationHeader) return null;
        return new URL(locationHeader, resolveRequestUrl(requestUrl)).toString();
      }

      async function getLocalStream() {
        if (sourceModeSelect.value === 'screen') {
          return navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false,
          });
        }
        return navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 15, max: 24 },
          },
          audio: false,
        });
      }

      function applyDefaults() {
        whipUrlInput.value = appConfig.defaultWhipUrl || '/online/whip';
        iceUrlsInput.value = (appConfig.defaultTurnUrls || []).join('\n');
        turnUsernameInput.value = appConfig.defaultTurnUsername || '';
        turnCredentialInput.value = appConfig.defaultTurnCredential || '';
      }

      async function stopPublishing() {
        if (sessionUrl) {
          try {
            await fetch(sessionUrl, { method: 'DELETE' });
            log(`deleted session ${sessionUrl}`);
          } catch (error) {
            log(`delete session failed: ${error.message}`);
          }
        }
        sessionUrl = null;
        if (pc) {
          pc.close();
          pc = null;
        }
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
        preview.srcObject = null;
      }

      async function startPublishing() {
        await stopPublishing();

        localStream = await getLocalStream();
        preview.srcObject = localStream;
        log(`local media ready source=${sourceModeSelect.value}`);

        pc = new RTCPeerConnection({ iceServers: buildIceServers() });
        pc.oniceconnectionstatechange = () => {
          log(`iceConnectionState=${pc.iceConnectionState}`);
        };
        pc.onconnectionstatechange = () => {
          log(`connectionState=${pc.connectionState}`);
        };

        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGatheringComplete(pc);

        const headers = {
          'Content-Type': 'application/sdp',
        };
        const token = bearerTokenInput.value.trim();
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const response = await fetch(whipUrlInput.value.trim(), {
          method: 'POST',
          headers,
          body: pc.localDescription.sdp,
        });

        if (!response.ok) {
          throw new Error(`WHIP request failed: ${response.status}`);
        }

        const answerSdp = await response.text();
        const location = response.headers.get('Location');
        sessionUrl = resolveSessionUrl(location, whipUrlInput.value.trim());
        if (sessionUrl) {
          log(`session created: ${sessionUrl}`);
        }

        await pc.setRemoteDescription({
          type: 'answer',
          sdp: answerSdp,
        });
        log('WHIP publishing started');
      }

      startBtn.onclick = async () => {
        try {
          await startPublishing();
        } catch (error) {
          log(`start failed: ${error.message}`);
        }
      };

      stopBtn.onclick = async () => {
        await stopPublishing();
        log('publishing stopped');
      };

      applyDefaults();
    </script>
  </body>
</html>
