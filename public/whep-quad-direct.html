<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHEP Quad Direct</title>
    <script src="/realtime-latency-chart.js"></script>
    <style>
      :root {
        --bg: #eef2f7;
        --panel: #ffffff;
        --line: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 11px/1.35 "SF Pro Text", "SF Pro Display", "PingFang SC", sans-serif;
        color: var(--text);
        min-height: 100vh;
        background:
          linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      }
      .wrap {
        width: min(1860px, calc(100% - 8px));
        margin: 0 auto;
        padding: 4px 0 6px;
        display: grid;
        gap: 6px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 10px;
        font-weight: 600;
      }
      .toolbar-spacer {
        flex: 1 1 auto;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1, p, h2 {
        margin: 0;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
      }
      .subtle {
        color: var(--muted);
        font-size: 10px;
      }
      .actions {
        display: inline-flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .hero-copy {
        display: grid;
        gap: 1px;
      }
      button, input {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 0 8px;
        min-width: 56px;
        min-height: 24px;
        cursor: pointer;
        background: #dbeafe;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.ghost {
        background: #e2e8f0;
        color: var(--text);
      }
      details summary {
        cursor: pointer;
        list-style: none;
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      .details-inline summary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 56px;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: #e2e8f0;
        color: var(--text);
        font-size: 11px;
      }
      .details-inline[open] summary {
        background: #cbd5e1;
      }
      .collapsible-body {
        margin-top: 6px;
      }
      .grid {
        display: grid;
        gap: 6px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: stretch;
      }
      #slots {
        grid-auto-rows: minmax(0, 1fr);
      }
      .slot {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        display: flex;
        min-height: 0;
      }
      .slot-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 0.92fr);
        width: 100%;
        min-height: 0;
      }
      .slot-media {
        background: #e5e7eb;
        border-right: 1px solid var(--line);
        aspect-ratio: auto;
        min-height: 0;
        padding: 6px;
      }
      .video-frame {
        width: 100%;
        height: 100%;
        min-height: 0;
        border-radius: 6px;
        overflow: hidden;
        background: #020617;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.16);
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #020617;
        display: block;
      }
      .slot-side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }
      .slot-head {
        display: grid;
        gap: 4px;
        padding: 6px;
        border-bottom: 1px solid var(--line);
        background: #fbfdff;
      }
      .slot-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .slot-title {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
        min-width: 0;
      }
      .slot-title strong {
        font-size: 12px;
        font-weight: 600;
      }
      .status {
        font-size: 10px;
        color: var(--muted);
      }
      .slot-actions {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-wrap: wrap;
      }
      .slot-config {
        display: grid;
        gap: 4px;
      }
      .slot-url {
        display: block;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 10px;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 6px;
      }
      .slot-footer {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }
      .metrics {
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        flex: 0 0 auto;
        padding: 6px;
      }
      .metric {
        display: grid;
        align-content: start;
        gap: 2px;
        min-width: 0;
        padding: 5px 6px;
        border-radius: 6px;
        background: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.16);
      }
      .metric-label {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .metric-value {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      .metric-sub {
        font-size: 9px;
        color: var(--muted);
        display: grid;
        gap: 1px;
      }
      .metric-sub strong {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--text);
      }
      .chart-panel {
        display: flex;
        gap: 0;
        padding: 4px 6px 6px;
        border-top: 1px solid var(--line);
        background: #f8fafc;
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }
      .chart-canvas {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.03), rgba(15, 23, 42, 0.01));
      }
      .log {
        min-height: 160px;
        max-height: 280px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.45;
        padding: 12px;
        border-radius: 14px;
        background: #111827;
        color: #e5e7eb;
      }
      .wall {
        height: calc(100vh - 60px);
      }
      .panel--compact {
        padding-top: 4px;
        padding-bottom: 4px;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wall {
          min-height: auto;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .slot-shell {
          grid-template-columns: 1fr;
        }
        .slot-media {
          min-height: 180px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="panel panel--compact" style="display:grid; gap:8px;">
        <div class="toolbar">
          <div class="hero-copy">
            <div class="title-row">
              <h1>四路直连播放</h1>
              <span class="badge" id="buildBadge">Build --</span>
            </div>
            <p class="subtle">只做 WHEP 直连，首屏同时观察四路视频、ORTM 和趋势。</p>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="actions">
            <button class="primary" id="startAllBtn">全部连接</button>
            <button id="stopAllBtn">全部停止</button>
          </div>
          <button class="ghost" id="toggleLogBtn">日志</button>
        </div>
      </section>

      <section class="grid wall" id="slots"></section>

      <details class="panel" id="logPanel">
        <summary><strong>日志</strong></summary>
        <div class="collapsible-body">
          <div id="log" class="log"></div>
        </div>
      </details>
    </div>

    <template id="slotTemplate">
      <article class="slot">
        <div class="slot-shell">
          <div class="slot-media">
            <div class="video-frame">
              <video autoplay playsinline controls muted></video>
            </div>
          </div>
          <div class="slot-side">
            <div class="slot-head">
              <div class="slot-topbar">
                <div class="slot-title">
                  <strong class="name"></strong>
                  <span class="status">idle</span>
                </div>
                <div class="slot-actions">
                  <button class="primary start">连接</button>
                  <button class="stop">停止</button>
                </div>
              </div>
              <input class="url slot-url" placeholder="http://127.0.0.1:9001/fish_front/whep" />
            </div>
            <div class="slot-footer">
              <div class="metrics">
                <div class="metric">
                  <span class="metric-label">ICE</span>
                  <strong class="metric-value ice">idle</strong>
                  <span class="metric-sub">分辨率 <strong class="resolution">--</strong></span>
                </div>
                <div class="metric">
                  <span class="metric-label">ORTM</span>
                  <strong class="metric-value latency-ortm">--</strong>
                  <span class="metric-sub">
                    净ORTM
                    <strong class="latency-ortm-net">--</strong>
                    样本年龄
                    <strong class="ortm-sample-age">--</strong>
                  </span>
                </div>
                <div class="metric">
                  <span class="metric-label">前段</span>
                  <strong class="metric-value latency-upstream">--</strong>
                  <span class="metric-sub">净前段 <strong class="latency-upstream-net">--</strong></span>
                </div>
                <div class="metric">
                  <span class="metric-label">播放侧</span>
                  <strong class="metric-value latency-fallback">--</strong>
                  <span class="metric-sub">
                    浏览器
                    <strong class="browser-cost">--</strong>
                    帧序号 / 停滞
                    <strong class="ortm-frame-state">--</strong>
                  </span>
                </div>
              </div>
              <div class="chart-panel">
                <canvas class="chart-canvas latency-chart" width="640" height="160"></canvas>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script>
      const BUILD_VERSION = '2026-07-11-whep-quad-direct-rtcstats-10';
      const logEl = document.getElementById('log');
      const logPanelEl = document.getElementById('logPanel');
      const slotsEl = document.getElementById('slots');
      const template = document.getElementById('slotTemplate');
      const buildBadgeEl = document.getElementById('buildBadge');
      const params = new URLSearchParams(location.search);
      buildBadgeEl.textContent = `Build ${BUILD_VERSION}`;
      const clientLogEndpoint = '/client-log';
      const clientLogPeerId = globalThis.crypto?.randomUUID?.() || `quad-${Date.now()}`;

      const defaultUrls = [
        params.get('whep1') || 'http://127.0.0.1:9001/fish_front/whep',
        params.get('whep2') || '',
        params.get('whep3') || '',
        params.get('whep4') || '',
      ];
      const ORTM_CONFIG = {
        x: 24,
        y: 24,
        cell: 12,
        padding: 12,
        gridSize: 32,
        finderSize: 4,
        timingIndex: 4,
        scales: [1.0, 0.95, 1.05, 0.9, 1.1],
        offsets: [0, -4, 4],
      };
      const ORTM_PAYLOAD_BITS = 4 + 16 + 32 + 16;
      const ORTM_MAX_REASONABLE_LATENCY_MS = 5000;
      const ORTM_DECODE_INTERVAL_MS = 500;
      const ORTM_DECODE_MODE = 'rvfc';
      const ORTM_STALL_CHART_INTERVAL_MS = 250;
      const ORTM_STALL_CHART_THRESHOLD_MS = 250;
      const CHART_WINDOW_MS = 60000;
      const CHART_AVG_WINDOW_MS = 10000;

      function log(message) {
        const line = `${new Date().toISOString()} ${message}`;
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(line);
      }

      function queueClientLog(entry) {
        const payload = JSON.stringify({
          peerId: clientLogPeerId,
          page: location.href,
          ...entry,
        });
        fetch(clientLogEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true,
        }).catch(() => {});
      }

      function crc16CcittFalse(bytes) {
        let crc = 0xffff;
        for (const byte of bytes) {
          crc ^= byte << 8;
          for (let index = 0; index < 8; index += 1) {
            if (crc & 0x8000) {
              crc = ((crc << 1) ^ 0x1021) & 0xffff;
            } else {
              crc = (crc << 1) & 0xffff;
            }
          }
        }
        return crc;
      }

      function ortmInFinder(row, col) {
        const { finderSize, gridSize } = ORTM_CONFIG;
        return (
          (row < finderSize && col < finderSize) ||
          (row < finderSize && col >= gridSize - finderSize) ||
          (row >= gridSize - finderSize && col < finderSize) ||
          (row >= gridSize - finderSize && col >= gridSize - finderSize)
        );
      }

      function ortmIsReservedCell(row, col) {
        return ortmInFinder(row, col) || row === ORTM_CONFIG.timingIndex || col === ORTM_CONFIG.timingIndex;
      }

      function ortmExpectedFinderBit(localRow, localCol) {
        return localRow === 0 || localRow === ORTM_CONFIG.finderSize - 1 || localCol === 0 || localCol === ORTM_CONFIG.finderSize - 1 ? 1 : 0;
      }

      function ortmBitsToNumber(bits, offset, width) {
        let value = 0;
        for (let index = 0; index < width; index += 1) {
          value = (value << 1) | bits[offset + index];
        }
        return value >>> 0;
      }

      function buildOrtmCandidates() {
        const candidates = [];
        for (const scale of ORTM_CONFIG.scales) {
          for (const dx of ORTM_CONFIG.offsets) {
            for (const dy of ORTM_CONFIG.offsets) {
              const cell = ORTM_CONFIG.cell * scale;
              const padding = ORTM_CONFIG.padding * scale;
              const markerSize = ORTM_CONFIG.gridSize * cell;
              candidates.push({
                scale,
                dx,
                dy,
                x: ORTM_CONFIG.x + dx,
                y: ORTM_CONFIG.y + dy,
                cell,
                padding,
                markerSize,
                boxSize: markerSize + padding * 2,
              });
            }
          }
        }
        return candidates;
      }

      const ORTM_CANDIDATES = buildOrtmCandidates();

      function ortmSampleCellLuma(imageData, frameWidth, frameHeight, candidate, row, col) {
        const positions = [0.2, 0.5, 0.8];
        const originX = candidate.x + candidate.padding + col * candidate.cell;
        const originY = candidate.y + candidate.padding + row * candidate.cell;
        let total = 0;
        let count = 0;
        for (const px of positions) {
          for (const py of positions) {
            const x = Math.round(originX + candidate.cell * px);
            const y = Math.round(originY + candidate.cell * py);
            if (x < 0 || x >= frameWidth || y < 0 || y >= frameHeight) {
              continue;
            }
            const offset = (y * frameWidth + x) * 4;
            const r = imageData.data[offset];
            const g = imageData.data[offset + 1];
            const b = imageData.data[offset + 2];
            total += 0.299 * r + 0.587 * g + 0.114 * b;
            count += 1;
          }
        }
        return count ? total / count : NaN;
      }

      function decodeOrtmFromImageData(imageData, frameWidth, frameHeight, nowMs) {
        let bestFailure = null;

        for (const candidate of ORTM_CANDIDATES) {
          if (
            candidate.x < 0 ||
            candidate.y < 0 ||
            candidate.x + candidate.boxSize > frameWidth ||
            candidate.y + candidate.boxSize > frameHeight
          ) {
            continue;
          }

          const lumaGrid = Array.from({ length: ORTM_CONFIG.gridSize }, () => new Array(ORTM_CONFIG.gridSize).fill(255));
          let minLuma = Infinity;
          let maxLuma = -Infinity;
          let invalid = false;

          for (let row = 0; row < ORTM_CONFIG.gridSize && !invalid; row += 1) {
            for (let col = 0; col < ORTM_CONFIG.gridSize; col += 1) {
              const luma = ortmSampleCellLuma(imageData, frameWidth, frameHeight, candidate, row, col);
              if (!Number.isFinite(luma)) {
                invalid = true;
                break;
              }
              lumaGrid[row][col] = luma;
              minLuma = Math.min(minLuma, luma);
              maxLuma = Math.max(maxLuma, luma);
            }
          }

          if (invalid) {
            continue;
          }

          const threshold = (minLuma + maxLuma) / 2;
          const contrast = maxLuma - minLuma;
          const bitGrid = lumaGrid.map((row) => row.map((luma) => (luma < threshold ? 1 : 0)));
          let finderErrors = 0;
          let timingErrors = 0;

          for (let row = 0; row < ORTM_CONFIG.gridSize; row += 1) {
            for (let col = 0; col < ORTM_CONFIG.gridSize; col += 1) {
              if (ortmInFinder(row, col)) {
                const localRow = row < ORTM_CONFIG.finderSize ? row : row - (ORTM_CONFIG.gridSize - ORTM_CONFIG.finderSize);
                const localCol = col < ORTM_CONFIG.finderSize ? col : col - (ORTM_CONFIG.gridSize - ORTM_CONFIG.finderSize);
                if (bitGrid[row][col] !== ortmExpectedFinderBit(localRow, localCol)) {
                  finderErrors += 1;
                }
              } else if (row === ORTM_CONFIG.timingIndex) {
                if (bitGrid[row][col] !== (col % 2)) {
                  timingErrors += 1;
                }
              } else if (col === ORTM_CONFIG.timingIndex) {
                if (bitGrid[row][col] !== (row % 2)) {
                  timingErrors += 1;
                }
              }
            }
          }

          const score = finderErrors * 4 + timingErrors * 2 - contrast / 32;
          const failureBase = {
            ok: false,
            score,
            finder_errors: finderErrors,
            timing_errors: timingErrors,
            threshold,
            contrast,
            candidate,
          };

          if (finderErrors > 8 || timingErrors > 10 || contrast < 32) {
            const failure = {
              ...failureBase,
              reason: finderErrors > 8 || timingErrors > 10 ? 'structure-mismatch' : 'low-contrast',
            };
            if (!bestFailure || failure.score < bestFailure.score) {
              bestFailure = failure;
            }
            continue;
          }

          const payloadBits = [];
          for (let row = 0; row < ORTM_CONFIG.gridSize; row += 1) {
            for (let col = 0; col < ORTM_CONFIG.gridSize; col += 1) {
              if (ortmIsReservedCell(row, col)) continue;
              payloadBits.push(bitGrid[row][col]);
            }
          }

          if (payloadBits.length < ORTM_PAYLOAD_BITS) {
            const failure = { ...failureBase, reason: 'payload-short' };
            if (!bestFailure || failure.score < bestFailure.score) {
              bestFailure = failure;
            }
            continue;
          }

          const version = ortmBitsToNumber(payloadBits, 0, 4);
          const frameSeq = ortmBitsToNumber(payloadBits, 4, 16);
          const timestampMs = ortmBitsToNumber(payloadBits, 20, 32);
          const crc16 = ortmBitsToNumber(payloadBits, 52, 16);
          const expectedCrc16 = crc16CcittFalse(new Uint8Array([
            version & 0x0f,
            (frameSeq >>> 8) & 0xff,
            frameSeq & 0xff,
            (timestampMs >>> 24) & 0xff,
            (timestampMs >>> 16) & 0xff,
            (timestampMs >>> 8) & 0xff,
            timestampMs & 0xff,
          ]));

          if (crc16 !== expectedCrc16) {
            const failure = { ...failureBase, reason: 'crc-mismatch' };
            if (!bestFailure || failure.score < bestFailure.score) {
              bestFailure = failure;
            }
            continue;
          }

          const latencyMs = ((nowMs >>> 0) - timestampMs) >>> 0;
          if (latencyMs < 0 || latencyMs >= ORTM_MAX_REASONABLE_LATENCY_MS) {
            const failure = { ...failureBase, reason: 'latency-out-of-range' };
            if (!bestFailure || failure.score < bestFailure.score) {
              bestFailure = failure;
            }
            continue;
          }

          return {
            ok: true,
            version,
            frame_seq: frameSeq,
            timestamp_ms: timestampMs,
            latency_ms: latencyMs,
            finder_errors: finderErrors,
            timing_errors: timingErrors,
            threshold,
            contrast,
            candidate,
          };
        }

        return bestFailure || {
          ok: false,
          reason: 'no-candidate',
          score: Infinity,
          finder_errors: null,
          timing_errors: null,
          threshold: null,
          contrast: null,
        };
      }

      function absoluteUrl(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        return new URL(raw, window.location.href).toString();
      }

      function waitForIceGatheringComplete(pc) {
        if (pc.iceGatheringState === 'complete') {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          const handler = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', handler);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', handler);
        });
      }

      function makeSlot(name, urlValue) {
        const node = template.content.firstElementChild.cloneNode(true);
        const nameEl = node.querySelector('.name');
        const statusEl = node.querySelector('.status');
        const urlEl = node.querySelector('.url');
        const startBtn = node.querySelector('.start');
        const stopBtn = node.querySelector('.stop');
        const iceEl = node.querySelector('.ice');
        const resolutionEl = node.querySelector('.resolution');
        const ortmLatencyEl = node.querySelector('.latency-ortm');
        const ortmNetLatencyEl = node.querySelector('.latency-ortm-net');
        const ortmSampleAgeEl = node.querySelector('.ortm-sample-age');
        const fallbackLatencyEl = node.querySelector('.latency-fallback');
        const upstreamLatencyEl = node.querySelector('.latency-upstream');
        const upstreamNetLatencyEl = node.querySelector('.latency-upstream-net');
        const browserCostEl = node.querySelector('.browser-cost');
        const ortmFrameStateEl = node.querySelector('.ortm-frame-state');
        const chartCanvasEl = node.querySelector('.latency-chart');
        const videoEl = node.querySelector('video');

        nameEl.textContent = name;
        urlEl.value = absoluteUrl(urlValue);
        urlEl.placeholder = 'http://127.0.0.1:9001/fish_front/whep';

        const state = {
          name,
          pc: null,
          sessionUrl: null,
          statsTimer: null,
          decodeTimer: null,
          stallChartTimer: null,
          decodeFrameCallbackId: null,
          decodeCanvas: document.createElement('canvas'),
          decodeCtx: null,
          ortmLastSuccessAt: 0,
          ortmLastAttemptAt: 0,
          ortmLastResult: null,
          ortmLastFailureReason: null,
          ortmLastLoggedFrameSeq: null,
          ortmFrameSeq: null,
          ortmFrameSeqStalledSince: 0,
          ortmFrameSeqRepeatCount: 0,
          lastMetricLogLine: null,
          lastChartSampleAt: 0,
          lastStallChartSampleAt: 0,
          chart: null,
          browserPerf: {
            count: 0,
            drawMsTotal: 0,
            readbackMsTotal: 0,
            decodeMsTotal: 0,
          },
          rtcStats: {},
          previousInboundStats: null,
          prefFreezeWatch: {
            recentRecvGaps: [],
            lastFreezeCount: null,
            lastLoggedAt: 0,
            lastReason: null,
          },
          rvfcStats: {
            lastCallbackAt: 0,
            gapMs: null,
            presentationAgeMs: null,
            displayLeadMs: null,
            mediaTimeMs: null,
            presentedFrames: null,
            presentedDelta: null,
          },
        };
        state.decodeCtx = state.decodeCanvas.getContext('2d', { willReadFrequently: true });
        state.chart = new window.RealtimeLatencyChart(chartCanvasEl, {
          windowMs: 12000,
          maxPoints: 240,
        });

        function setStatus(text) {
          statusEl.textContent = text;
        }

        function parseMetricMs(text) {
          const match = String(text || '').match(/(\d+(?:\.\d+)?)/);
          return match ? Number(match[1]) : NaN;
        }

        function renderChart() {
          state.chart?.resize();
        }

        function formatMsText(value) {
          if (!Number.isFinite(value)) return '--';
          return `${Math.round(value)} ms`;
        }

        function updateOrtmActivityMetrics() {
          const now = performance.now();
          const sampleAgeMs = state.ortmLastSuccessAt > 0 ? now - state.ortmLastSuccessAt : NaN;
          ortmSampleAgeEl.textContent = formatMsText(sampleAgeMs);

          if (state.ortmFrameSeq == null) {
            ortmFrameStateEl.textContent = '--';
            return;
          }

          const stalledMs = state.ortmFrameSeqStalledSince > 0 ? now - state.ortmFrameSeqStalledSince : 0;
          ortmFrameStateEl.textContent = `${state.ortmFrameSeq} / ${Math.round(stalledMs)} ms`;
        }

        function pushChartSample(value) {
          if (!Number.isFinite(value)) return;
          const now = performance.now();
          if (now - state.lastChartSampleAt < 250) return;
          state.lastChartSampleAt = now;
          state.chart?.push(value, now, false);
        }

        function pushStallChartSample() {
          if (!state.ortmLastResult || state.ortmFrameSeq == null || !state.ortmFrameSeqStalledSince) {
            return;
          }
          const nowPerf = performance.now();
          const stalledMs = nowPerf - state.ortmFrameSeqStalledSince;
          if (stalledMs < ORTM_STALL_CHART_THRESHOLD_MS) {
            return;
          }
          if (nowPerf - state.lastStallChartSampleAt < ORTM_STALL_CHART_INTERVAL_MS) {
            return;
          }
          const syntheticLatencyMs = ((Date.now() >>> 0) - (state.ortmLastResult.timestamp_ms >>> 0)) >>> 0;
          if (!Number.isFinite(syntheticLatencyMs) || syntheticLatencyMs >= ORTM_MAX_REASONABLE_LATENCY_MS) {
            return;
          }
          state.lastStallChartSampleAt = nowPerf;
          state.lastChartSampleAt = nowPerf;
          state.chart?.push(syntheticLatencyMs, nowPerf, true);
        }

        function updateDerivedLatency() {
          const ortmMs = state.ortmLastResult?.latency_ms;
          const fallbackMs = parseMetricMs(fallbackLatencyEl.textContent);
          const browserMs = state.browserPerf.count
            ? (state.browserPerf.drawMsTotal + state.browserPerf.readbackMsTotal + state.browserPerf.decodeMsTotal) / state.browserPerf.count
            : NaN;
          if (Number.isFinite(ortmMs) && Number.isFinite(fallbackMs) && ortmMs >= fallbackMs) {
            upstreamLatencyEl.textContent = `${Math.round(ortmMs - fallbackMs)} ms`;
          } else {
            upstreamLatencyEl.textContent = '--';
          }
          if (Number.isFinite(ortmMs) && Number.isFinite(browserMs) && ortmMs >= browserMs) {
            ortmNetLatencyEl.textContent = `${Math.round(ortmMs - browserMs)} ms`;
          } else {
            ortmNetLatencyEl.textContent = '--';
          }
          const upstreamMs = parseMetricMs(upstreamLatencyEl.textContent);
          if (Number.isFinite(upstreamMs) && Number.isFinite(browserMs) && upstreamMs >= browserMs) {
            upstreamNetLatencyEl.textContent = `${Math.round(upstreamMs - browserMs)} ms`;
          } else {
            upstreamNetLatencyEl.textContent = '--';
          }
        }

        function emitMetricLog() {
          const browserPerf = state.browserPerf.count
            ? `browser=${browserCostEl.textContent || '--'} draw=${(state.browserPerf.drawMsTotal / state.browserPerf.count).toFixed(1)}ms read=${(state.browserPerf.readbackMsTotal / state.browserPerf.count).toFixed(1)}ms decode=${(state.browserPerf.decodeMsTotal / state.browserPerf.count).toFixed(1)}ms`
            : 'browser=-- draw=-- read=-- decode=--';
          const rtcStats = [
            `rtcJitter=${formatMetricValue(state.rtcStats.jitterBufferMs, 'ms')}`,
            `rtcJbTarget=${formatMetricValue(state.rtcStats.jitterBufferTargetMs, 'ms')}`,
            `rtcJbMin=${formatMetricValue(state.rtcStats.jitterBufferMinimumMs, 'ms')}`,
            `rtcDecode=${formatMetricValue(state.rtcStats.decodeMs, 'ms')}`,
            `rtcFps=${formatMetricValue(state.rtcStats.framesPerSecond, '')}`,
            `rtcRecvFps=${formatMetricValue(state.rtcStats.framesReceivedPerSecond, '')}`,
            `rtcDecFps=${formatMetricValue(state.rtcStats.framesDecodedPerSecond, '')}`,
            `rtcRecvGap=${formatMetricValue(state.rtcStats.receiveDecodeGap, '')}`,
            `rtcFrameInt=${formatMetricValue(state.rtcStats.interFrameDelayMs, 'ms')}`,
            `rtcFreezeCount=${formatMetricValue(state.rtcStats.freezeCount, '')}`,
            `rtcFreezeDur=${formatMetricValue(state.rtcStats.freezeDurationMs, 'ms')}`,
            `rtcPauseCount=${formatMetricValue(state.rtcStats.pauseCount, '')}`,
            `rtcPauseDur=${formatMetricValue(state.rtcStats.pauseDurationMs, 'ms')}`,
            `rtcDrop=${formatMetricValue(state.rtcStats.framesDropped, '')}`,
            `rtcBitrate=${formatMetricValue(state.rtcStats.bitrateKbps, 'kbps')}`,
            `rtcPacketsLost=${formatMetricValue(state.rtcStats.packetsLost, '')}`,
          ].join(' ');
          const line = [
            `slot=${name}`,
            `ice=${iceEl.textContent || 'idle'}`,
            `resolution=${resolutionEl.textContent || '--'}`,
            `ortm=${ortmLatencyEl.textContent || '--'}`,
            `ortmNet=${ortmNetLatencyEl.textContent || '--'}`,
            `ortmSampleAge=${ortmSampleAgeEl.textContent || '--'}`,
            `ortmFrameSeq=${state.ortmFrameSeq ?? '--'}`,
            `ortmFrameStall=${state.ortmFrameSeqStalledSince > 0 ? Math.round(performance.now() - state.ortmFrameSeqStalledSince) : '--'}ms`,
            `fallback=${fallbackLatencyEl.textContent || '--'}`,
            `upstream=${upstreamLatencyEl.textContent || '--'}`,
            `upstreamNet=${upstreamNetLatencyEl.textContent || '--'}`,
            `decodeMode=${state.decodeMode || ORTM_DECODE_MODE}`,
            `rvfcGap=${formatMetricValue(state.rvfcStats.gapMs, 'ms')}`,
            `rvfcPresentationAge=${formatMetricValue(state.rvfcStats.presentationAgeMs, 'ms')}`,
            `rvfcLead=${formatMetricValue(state.rvfcStats.displayLeadMs, 'ms')}`,
            `rvfcPresented=${formatMetricValue(state.rvfcStats.presentedFrames, '')}`,
            `rvfcPresentedDelta=${formatMetricValue(state.rvfcStats.presentedDelta, '')}`,
            browserPerf,
            rtcStats,
            `status=${statusEl.textContent || '--'}`,
          ].join(' ');
          if (line === state.lastMetricLogLine) {
            return;
          }
          state.lastMetricLogLine = line;
          queueClientLog({
            group: 'metrics',
            level: 'info',
            message: line,
          });
        }

        function stopDecoder() {
          if (state.decodeTimer) {
            clearInterval(state.decodeTimer);
            state.decodeTimer = null;
          }
          if (state.stallChartTimer) {
            clearInterval(state.stallChartTimer);
            state.stallChartTimer = null;
          }
          if (
            state.decodeFrameCallbackId != null &&
            typeof videoEl.cancelVideoFrameCallback === 'function'
          ) {
            videoEl.cancelVideoFrameCallback(state.decodeFrameCallbackId);
          }
          state.decodeFrameCallbackId = null;
          state.ortmLastSuccessAt = 0;
          state.ortmLastAttemptAt = 0;
          state.ortmLastResult = null;
          state.ortmLastFailureReason = null;
          state.ortmLastLoggedFrameSeq = null;
          state.ortmFrameSeq = null;
          state.ortmFrameSeqStalledSince = 0;
          state.ortmFrameSeqRepeatCount = 0;
          state.lastMetricLogLine = null;
          state.decodeMode = ORTM_DECODE_MODE;
          state.lastChartSampleAt = 0;
          state.lastStallChartSampleAt = 0;
          state.chart?.clear();
          state.browserPerf = {
            count: 0,
            drawMsTotal: 0,
            readbackMsTotal: 0,
            decodeMsTotal: 0,
          };
          state.rtcStats = {};
          state.previousInboundStats = null;
          state.prefFreezeWatch = {
            recentRecvGaps: [],
            lastFreezeCount: null,
            lastLoggedAt: 0,
            lastReason: null,
          };
          state.rvfcStats = {
            lastCallbackAt: 0,
            gapMs: null,
            presentationAgeMs: null,
            displayLeadMs: null,
            mediaTimeMs: null,
            presentedFrames: null,
            presentedDelta: null,
          };
          ortmLatencyEl.textContent = '--';
          ortmNetLatencyEl.textContent = '--';
          ortmSampleAgeEl.textContent = '--';
          upstreamLatencyEl.textContent = '--';
          upstreamNetLatencyEl.textContent = '--';
          browserCostEl.textContent = '--';
          ortmFrameStateEl.textContent = '--';
          renderChart();
        }

        function updateLatencyFromOrtm() {
          state.ortmLastAttemptAt = performance.now();
          if (
            !state.decodeCtx ||
            !videoEl.videoWidth ||
            !videoEl.videoHeight ||
            videoEl.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
          ) {
            return;
          }
          const width = videoEl.videoWidth;
          const height = videoEl.videoHeight;
          if (state.decodeCanvas.width !== width) state.decodeCanvas.width = width;
          if (state.decodeCanvas.height !== height) state.decodeCanvas.height = height;
          const drawStartedAt = performance.now();
          state.decodeCtx.drawImage(videoEl, 0, 0, width, height);
          const drawFinishedAt = performance.now();
          const imageData = state.decodeCtx.getImageData(0, 0, width, height);
          const readbackFinishedAt = performance.now();
          const result = decodeOrtmFromImageData(imageData, width, height, Date.now());
          const decodeFinishedAt = performance.now();
          const drawMs = drawFinishedAt - drawStartedAt;
          const readbackMs = readbackFinishedAt - drawFinishedAt;
          const decodeMs = decodeFinishedAt - readbackFinishedAt;
          state.browserPerf.count += 1;
          state.browserPerf.drawMsTotal += drawMs;
          state.browserPerf.readbackMsTotal += readbackMs;
          state.browserPerf.decodeMsTotal += decodeMs;
          const avgDrawMs = state.browserPerf.drawMsTotal / state.browserPerf.count;
          const avgReadbackMs = state.browserPerf.readbackMsTotal / state.browserPerf.count;
          const avgDecodeMs = state.browserPerf.decodeMsTotal / state.browserPerf.count;
          browserCostEl.textContent = `${(avgDrawMs + avgReadbackMs + avgDecodeMs).toFixed(1)} ms`;

          if (result.ok) {
            const nowPerf = performance.now();
            state.ortmLastSuccessAt = nowPerf;
            state.ortmLastResult = result;
            if (state.ortmFrameSeq === result.frame_seq) {
              if (!state.ortmFrameSeqStalledSince) {
                state.ortmFrameSeqStalledSince = nowPerf;
              }
              state.ortmFrameSeqRepeatCount += 1;
            } else {
              state.ortmFrameSeq = result.frame_seq;
              state.ortmFrameSeqStalledSince = nowPerf;
              state.ortmFrameSeqRepeatCount = 0;
            }
            ortmLatencyEl.textContent = `${Math.round(result.latency_ms)} ms`;
            pushChartSample(result.latency_ms);
            updateDerivedLatency();
            updateOrtmActivityMetrics();
            const shouldLogSuccess =
              state.ortmLastLoggedFrameSeq == null ||
              (((result.frame_seq - state.ortmLastLoggedFrameSeq) + 65536) % 65536) >= 30;
            if (shouldLogSuccess) {
              log(
                `${name} ORTM ok seq=${result.frame_seq} latency=${Math.round(result.latency_ms)}ms finder=${result.finder_errors} timing=${result.timing_errors} contrast=${result.contrast.toFixed(1)}`
              );
              state.ortmLastLoggedFrameSeq = result.frame_seq;
            }
            state.ortmLastFailureReason = null;
          } else if (state.ortmLastFailureReason !== result.reason && performance.now() - state.ortmLastSuccessAt > 1500) {
            updateOrtmActivityMetrics();
            log(
              `${name} ORTM fail reason=${result.reason} score=${Number.isFinite(result.score) ? result.score.toFixed(1) : 'inf'} finder=${result.finder_errors ?? '--'} timing=${result.timing_errors ?? '--'} contrast=${result.contrast == null ? '--' : result.contrast.toFixed(1)}`
            );
            state.ortmLastFailureReason = result.reason;
          } else {
            updateOrtmActivityMetrics();
          }
        }

        function startDecoder() {
          stopDecoder();
          state.decodeMode = (
            ORTM_DECODE_MODE === 'rvfc' &&
            typeof videoEl.requestVideoFrameCallback === 'function'
          ) ? 'rvfc' : 'interval';
          state.stallChartTimer = setInterval(() => {
            pushStallChartSample();
            updateOrtmActivityMetrics();
          }, ORTM_STALL_CHART_INTERVAL_MS);
          if (state.decodeMode === 'rvfc') {
            const onVideoFrame = (_now, metadata) => {
              state.decodeFrameCallbackId = null;
              const callbackNow = performance.now();
              if (state.rvfcStats.lastCallbackAt > 0) {
                state.rvfcStats.gapMs = callbackNow - state.rvfcStats.lastCallbackAt;
              }
              state.rvfcStats.lastCallbackAt = callbackNow;
              if (metadata && Number.isFinite(metadata.presentationTime)) {
                state.rvfcStats.presentationAgeMs = callbackNow - metadata.presentationTime;
              } else {
                state.rvfcStats.presentationAgeMs = null;
              }
              if (metadata && Number.isFinite(metadata.expectedDisplayTime)) {
                state.rvfcStats.displayLeadMs = metadata.expectedDisplayTime - callbackNow;
              } else {
                state.rvfcStats.displayLeadMs = null;
              }
              if (metadata && Number.isFinite(metadata.mediaTime)) {
                state.rvfcStats.mediaTimeMs = metadata.mediaTime * 1000;
              } else {
                state.rvfcStats.mediaTimeMs = null;
              }
              if (metadata && Number.isFinite(metadata.presentedFrames)) {
                state.rvfcStats.presentedDelta =
                  state.rvfcStats.presentedFrames != null
                    ? metadata.presentedFrames - state.rvfcStats.presentedFrames
                    : null;
                state.rvfcStats.presentedFrames = metadata.presentedFrames;
              } else {
                state.rvfcStats.presentedDelta = null;
                state.rvfcStats.presentedFrames = null;
              }
              try {
                updateLatencyFromOrtm();
              } catch (error) {
                const reason = `decode-error:${error.message}`;
                if (state.ortmLastFailureReason !== reason) {
                  state.ortmLastFailureReason = reason;
                  log(`${name} ORTM decode error: ${error.message}`);
                }
              }
              if (state.pc && videoEl.srcObject) {
                state.decodeFrameCallbackId = videoEl.requestVideoFrameCallback(onVideoFrame);
              }
            };
            state.decodeFrameCallbackId = videoEl.requestVideoFrameCallback(onVideoFrame);
            return;
          }
          state.decodeTimer = setInterval(() => {
            try {
              updateLatencyFromOrtm();
            } catch (error) {
              const reason = `decode-error:${error.message}`;
              if (state.ortmLastFailureReason !== reason) {
                state.ortmLastFailureReason = reason;
                log(`${name} ORTM decode error: ${error.message}`);
              }
            }
          }, ORTM_DECODE_INTERVAL_MS);
        }

        async function stop() {
          if (state.statsTimer) {
            clearInterval(state.statsTimer);
            state.statsTimer = null;
          }
          stopDecoder();
          if (state.sessionUrl) {
            try {
              await fetch(state.sessionUrl, { method: 'DELETE' });
              log(`${name} deleted session ${state.sessionUrl}`);
            } catch (error) {
              log(`${name} delete session failed: ${error.message}`);
            }
          }
          state.sessionUrl = null;
          if (state.pc) {
            state.pc.close();
            state.pc = null;
          }
          videoEl.srcObject = null;
          iceEl.textContent = 'idle';
          resolutionEl.textContent = '--';
          ortmLatencyEl.textContent = '--';
          ortmNetLatencyEl.textContent = '--';
          fallbackLatencyEl.textContent = '--';
          upstreamLatencyEl.textContent = '--';
          upstreamNetLatencyEl.textContent = '--';
          browserCostEl.textContent = '--';
          state.lastMetricLogLine = null;
          setStatus('stopped');
          renderChart();
          emitMetricLog();
        }

        async function start() {
          await stop();

          const whepUrl = absoluteUrl(urlEl.value);
          if (!whepUrl) {
            setStatus('missing url');
            return;
          }

          const pc = new RTCPeerConnection({ iceServers: [] });
          state.pc = pc;
          setStatus('connecting');
          log(`${name} start url=${whepUrl}`);
          log(
            `${name} browser ua=${navigator.userAgent} platform=${navigator.userAgentData?.platform || navigator.platform || 'unknown'}`
          );

          pc.addTransceiver('video', { direction: 'recvonly' });

          pc.ontrack = (event) => {
            videoEl.srcObject = event.streams[0];
            try {
              if (event.receiver && 'playoutDelayHint' in event.receiver) {
                event.receiver.playoutDelayHint = 0;
                log(`${name} playoutDelayHint=0`);
              }
            } catch (error) {
              log(`${name} playoutDelayHint failed: ${error.message}`);
            }
            startDecoder();
            setStatus('playing');
            log(`${name} remote track received`);
          };

          pc.oniceconnectionstatechange = () => {
            iceEl.textContent = pc.iceConnectionState;
            log(`${name} ICE=${pc.iceConnectionState}`);
          };

          pc.onconnectionstatechange = () => {
            log(`${name} PC=${pc.connectionState}`);
          };

          pc.onicegatheringstatechange = () => {
            log(`${name} gathering=${pc.iceGatheringState}`);
          };

          pc.onsignalingstatechange = () => {
            log(`${name} signaling=${pc.signalingState}`);
          };

          const offer = await pc.createOffer();
          log(`${name} offer created`);
          await pc.setLocalDescription(offer);
          log(`${name} local description set`);
          await waitForIceGatheringComplete(pc);
          log(`${name} local ICE gathering complete`);

          const localSdp = pc.localDescription?.sdp || '';
          const localCandidates = Array.from(localSdp.matchAll(/^a=candidate:.*$/gm)).map((match) => match[0]);
          log(`${name} local candidates=${localCandidates.length}`);
          localCandidates.forEach((line, index) => log(`${name} local candidate[${index}] ${line}`));

          const response = await fetch(whepUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/sdp',
            },
            body: pc.localDescription.sdp,
          });

          log(`${name} WHEP POST status=${response.status}`);

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`WHEP request failed: ${response.status} body=${errorText.slice(0, 300)}`);
          }

          const location = response.headers.get('Location');
          const answerSdp = await response.text();
          const remoteCandidates = Array.from(answerSdp.matchAll(/^a=candidate:.*$/gm)).map((match) => match[0]);
          log(`${name} remote location=${location || '<none>'}`);
          log(`${name} remote candidates=${remoteCandidates.length}`);
          remoteCandidates.forEach((line, index) => log(`${name} remote candidate[${index}] ${line}`));
          state.sessionUrl = location ? new URL(location, whepUrl).toString() : null;
          await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
          pc.getReceivers().forEach((receiver, index) => {
            try {
              if ('playoutDelayHint' in receiver) {
                receiver.playoutDelayHint = 0;
                log(`${name} receiver[${index}] playoutDelayHint=0`);
              }
            } catch (error) {
              log(`${name} receiver[${index}] playoutDelayHint failed: ${error.message}`);
            }
          });
          log(`${name} playback started url=${whepUrl}`);

          state.statsTimer = setInterval(async () => {
            if (!state.pc) return;
            const tracks = videoEl.videoWidth && videoEl.videoHeight
              ? `${videoEl.videoWidth}x${videoEl.videoHeight}`
              : '--';
            resolutionEl.textContent = tracks;
            try {
              const stats = await state.pc.getStats();
              let inbound = null;
              stats.forEach((report) => {
                if (report.type === 'inbound-rtp' && report.kind === 'video') {
                  inbound = report;
                }
              });
              updateRtcStats(inbound);
              if (
                state.ortmLastResult &&
                performance.now() - state.ortmLastSuccessAt < 1500 &&
                typeof state.ortmLastResult.latency_ms === 'number'
              ) {
                ortmLatencyEl.textContent = `${Math.round(state.ortmLastResult.latency_ms)} ms`;
              } else {
                ortmLatencyEl.textContent = '--';
              }
              updateOrtmActivityMetrics();
              if (
                inbound &&
                typeof inbound.estimatedPlayoutTimestamp === 'number' &&
                typeof inbound.lastPacketReceivedTimestamp === 'number'
              ) {
                const directMs = inbound.estimatedPlayoutTimestamp - inbound.lastPacketReceivedTimestamp;
                if (Number.isFinite(directMs) && directMs >= 0 && directMs < 60000) {
                  fallbackLatencyEl.textContent = `${directMs.toFixed(0)} ms`;
                  updateDerivedLatency();
                  emitMetricLog();
                  return;
                }
              }
              if (inbound && typeof inbound.jitterBufferDelay === 'number' && typeof inbound.jitterBufferEmittedCount === 'number' && inbound.jitterBufferEmittedCount > 0) {
                const avgMs = inbound.jitterBufferDelay / inbound.jitterBufferEmittedCount * 1000;
                fallbackLatencyEl.textContent = `${avgMs.toFixed(0)} ms`;
              } else {
                fallbackLatencyEl.textContent = '--';
              }
              updateDerivedLatency();
              emitMetricLog();
            } catch (error) {
              fallbackLatencyEl.textContent = 'err';
              updateOrtmActivityMetrics();
              updateDerivedLatency();
              emitMetricLog();
            }
          }, 1000);
        }

        function formatMetricValue(value, unit) {
          if (!Number.isFinite(value)) return '--';
          const digits = Math.abs(value) >= 100 ? 0 : 1;
          return `${value.toFixed(digits)}${unit}`;
        }

        function numberOrNull(value) {
          return Number.isFinite(value) ? value : null;
        }

        function maybeLogPreFreeze(rtcStats) {
          if (!rtcStats) return;
          const watch = state.prefFreezeWatch;
          const now = performance.now();

          if (Number.isFinite(rtcStats.receiveDecodeGap)) {
            watch.recentRecvGaps.push(rtcStats.receiveDecodeGap);
            if (watch.recentRecvGaps.length > 4) {
              watch.recentRecvGaps.shift();
            }
          }

          const gaps = watch.recentRecvGaps;
          const gapRising =
            gaps.length >= 4 &&
            gaps[1] > gaps[0] &&
            gaps[2] > gaps[1] &&
            gaps[3] > gaps[2];
          const decodeLagging =
            Number.isFinite(rtcStats.framesReceivedPerSecond) &&
            Number.isFinite(rtcStats.framesDecodedPerSecond) &&
            rtcStats.framesReceivedPerSecond - rtcStats.framesDecodedPerSecond >= 5;
          const freezeAdvanced =
            Number.isFinite(rtcStats.freezeCount) &&
            watch.lastFreezeCount != null &&
            rtcStats.freezeCount > watch.lastFreezeCount;

          let reason = null;
          if (freezeAdvanced) {
            reason = 'freeze-count-advanced';
          } else if (gapRising) {
            reason = 'recv-gap-rising';
          } else if (decodeLagging) {
            reason = 'decode-lagging';
          }

          if (
            reason &&
            (watch.lastReason !== reason || now - watch.lastLoggedAt >= 3000)
          ) {
            watch.lastReason = reason;
            watch.lastLoggedAt = now;
            queueClientLog({
              group: 'signal',
              level: 'warn',
              message:
                `${name} pre-freeze reason=${reason} ` +
                `recvGap=${formatMetricValue(rtcStats.receiveDecodeGap, '')} ` +
                `recvFps=${formatMetricValue(rtcStats.framesReceivedPerSecond, '')} ` +
                `decFps=${formatMetricValue(rtcStats.framesDecodedPerSecond, '')} ` +
                `freezeCount=${formatMetricValue(rtcStats.freezeCount, '')} ` +
                `freezeDur=${formatMetricValue(rtcStats.freezeDurationMs, 'ms')} ` +
                `jbTarget=${formatMetricValue(rtcStats.jitterBufferTargetMs, 'ms')} ` +
                `jitter=${formatMetricValue(rtcStats.jitterBufferMs, 'ms')}`
            });
          }

          if (Number.isFinite(rtcStats.freezeCount)) {
            watch.lastFreezeCount = rtcStats.freezeCount;
          }
        }

        function updateRtcStats(inbound) {
          if (!inbound) {
            state.rtcStats = {};
            state.previousInboundStats = null;
            return;
          }

          const current = {
            timestamp: numberOrNull(inbound.timestamp),
            bytesReceived: numberOrNull(inbound.bytesReceived),
            jitterBufferDelay: numberOrNull(inbound.jitterBufferDelay),
            jitterBufferTargetDelay: numberOrNull(inbound.jitterBufferTargetDelay),
            jitterBufferMinimumDelay: numberOrNull(inbound.jitterBufferMinimumDelay),
            jitterBufferEmittedCount: numberOrNull(inbound.jitterBufferEmittedCount),
            totalDecodeTime: numberOrNull(inbound.totalDecodeTime),
            totalInterFrameDelay: numberOrNull(inbound.totalInterFrameDelay),
            totalFreezesDuration: numberOrNull(inbound.totalFreezesDuration),
            totalPausesDuration: numberOrNull(inbound.totalPausesDuration),
            freezeCount: numberOrNull(inbound.freezeCount),
            pauseCount: numberOrNull(inbound.pauseCount),
            framesReceived: numberOrNull(inbound.framesReceived),
            framesDecoded: numberOrNull(inbound.framesDecoded),
          };
          const previous = state.previousInboundStats;
          const rtcStats = {
            framesPerSecond: numberOrNull(inbound.framesPerSecond),
            framesDropped: numberOrNull(inbound.framesDropped),
            packetsLost: numberOrNull(inbound.packetsLost),
            freezeCount: numberOrNull(inbound.freezeCount),
            pauseCount: numberOrNull(inbound.pauseCount),
          };

          if (current.framesReceived != null && current.framesDecoded != null) {
            rtcStats.receiveDecodeGap = current.framesReceived - current.framesDecoded;
          }
          if (current.jitterBufferMinimumDelay != null) {
            rtcStats.jitterBufferMinimumMs = current.jitterBufferMinimumDelay * 1000;
          }

          if (previous && current.timestamp != null && previous.timestamp != null) {
            const elapsedSeconds = (current.timestamp - previous.timestamp) / 1000;
            if (elapsedSeconds > 0 && current.bytesReceived != null && previous.bytesReceived != null) {
              rtcStats.bitrateKbps = ((current.bytesReceived - previous.bytesReceived) * 8) / elapsedSeconds / 1000;
            }
            if (elapsedSeconds > 0 && current.framesReceived != null && previous.framesReceived != null) {
              rtcStats.framesReceivedPerSecond = (current.framesReceived - previous.framesReceived) / elapsedSeconds;
            }
            if (elapsedSeconds > 0 && current.framesDecoded != null && previous.framesDecoded != null) {
              rtcStats.framesDecodedPerSecond = (current.framesDecoded - previous.framesDecoded) / elapsedSeconds;
            }
            if (
              current.jitterBufferDelay != null &&
              previous.jitterBufferDelay != null &&
              current.jitterBufferEmittedCount != null &&
              previous.jitterBufferEmittedCount != null
            ) {
              const emittedDelta = current.jitterBufferEmittedCount - previous.jitterBufferEmittedCount;
              if (emittedDelta > 0) {
                rtcStats.jitterBufferMs = ((current.jitterBufferDelay - previous.jitterBufferDelay) / emittedDelta) * 1000;
                if (
                  current.jitterBufferTargetDelay != null &&
                  previous.jitterBufferTargetDelay != null
                ) {
                  rtcStats.jitterBufferTargetMs = ((current.jitterBufferTargetDelay - previous.jitterBufferTargetDelay) / emittedDelta) * 1000;
                }
              }
            }
            if (
              current.totalDecodeTime != null &&
              previous.totalDecodeTime != null &&
              current.framesDecoded != null &&
              previous.framesDecoded != null
            ) {
              const decodedDelta = current.framesDecoded - previous.framesDecoded;
              if (decodedDelta > 0) {
                rtcStats.decodeMs = ((current.totalDecodeTime - previous.totalDecodeTime) / decodedDelta) * 1000;
              }
            }
            if (
              current.totalInterFrameDelay != null &&
              previous.totalInterFrameDelay != null &&
              current.framesDecoded != null &&
              previous.framesDecoded != null
            ) {
              const decodedDelta = current.framesDecoded - previous.framesDecoded;
              if (decodedDelta > 0) {
                rtcStats.interFrameDelayMs = ((current.totalInterFrameDelay - previous.totalInterFrameDelay) / decodedDelta) * 1000;
              }
            }
            if (
              current.totalFreezesDuration != null &&
              previous.totalFreezesDuration != null
            ) {
              rtcStats.freezeDurationMs = (current.totalFreezesDuration - previous.totalFreezesDuration) * 1000;
            }
            if (
              current.totalPausesDuration != null &&
              previous.totalPausesDuration != null
            ) {
              rtcStats.pauseDurationMs = (current.totalPausesDuration - previous.totalPausesDuration) * 1000;
            }
          }

          state.previousInboundStats = current;
          state.rtcStats = rtcStats;
          maybeLogPreFreeze(rtcStats);
        }

        startBtn.addEventListener('click', async () => {
          try {
            await start();
          } catch (error) {
            setStatus('error');
            log(`${name} ${error.message}`);
          }
        });

        stopBtn.addEventListener('click', () => {
          stop().catch((error) => log(`${name} stop failed: ${error.message}`));
        });

        return { node, start, stop, renderChart };
      }

      const slots = [
        makeSlot('Front', defaultUrls[0]),
        makeSlot('Back', defaultUrls[1]),
        makeSlot('Left', defaultUrls[2]),
        makeSlot('Right', defaultUrls[3]),
      ];

      slots.forEach((slot) => slotsEl.appendChild(slot.node));

      document.getElementById('startAllBtn').addEventListener('click', async () => {
        for (const slot of slots) {
          try {
            await slot.start();
          } catch (error) {
            log(`start all failed: ${error.message}`);
          }
        }
      });

      document.getElementById('stopAllBtn').addEventListener('click', async () => {
        for (const slot of slots) {
          try {
            await slot.stop();
          } catch (error) {
            log(`stop all failed: ${error.message}`);
          }
        }
      });

      document.getElementById('toggleLogBtn')?.addEventListener('click', () => {
        logPanelEl.open = !logPanelEl.open;
      });

      window.addEventListener('resize', () => {
        slots.forEach((slot) => {
          if (typeof slot.renderChart === 'function') {
            slot.renderChart();
          }
        });
      });

      log('quad direct viewer ready');
    </script>
  </body>
</html>
